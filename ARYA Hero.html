<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARYA · The Keeping — Hero</title>
<link rel="stylesheet" href="arya-hero.css" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0907; }
  /* the dark hero hides the page grain layer */
  body::before { display: none !important; }
  #root { position: relative; z-index: 1; }
  .aryah-boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0907; color: #837a6d; z-index: 999;
    font: 500 10px/1 'Manrope', sans-serif; letter-spacing: 0.3em; text-transform: uppercase;
    transition: opacity .8s ease;
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="aryah-boot" id="boot">ARYA · архив открывается</div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#181310"/>
    <radialGradient id="g" cx="50%" cy="44%" r="40%">
      <stop offset="0" stop-color="#e8c79a"/>
      <stop offset="1" stop-color="#181310" stop-opacity="0"/>
    </radialGradient>
    <circle cx="50" cy="44" r="34" fill="url(#g)"/>
    <ellipse cx="50" cy="44" rx="11" ry="15" fill="#c79356"/>
    <text x="50" y="84" font-family="Georgia, serif" font-size="13" letter-spacing="4" text-anchor="middle" fill="#ece3d2">ARYA</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="arya-hero.jsx"></script>
<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakSlider, TweakColor, TweakText, TweakRadio } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "warmth": 0.5,
  "pace": 1,
  "entropy": 1,
  "density": "regular",
  "thesis": "Каждое семя хранит миллионы лет памяти. Мы следим, чтобы сообщение дошло."
}/*EDITMODE-END*/;

function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    const b = document.getElementById('boot');
    if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 900); }
  }, []);
  return (
    <React.Fragment>
      <AryaHero t={t} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Свет / Light" />
        <TweakSlider label="Тепло света" value={t.warmth} min={0} max={1} step={0.05}
                     onChange={(v) => setTweak('warmth', v)} />
        <TweakSlider label="Длина / pacing" value={t.pace} min={0.5} max={1.8} step={0.1}
                     onChange={(v) => setTweak('pace', v)} />
        <TweakSection label="Архив / Archive" />
        <TweakRadio label="Плотность" value={t.density}
                    options={['sparse', 'regular', 'dense']}
                    onChange={(v) => setTweak('density', v)} />
        <TweakSlider label="Энтропия" value={t.entropy} min={0} max={1.4} step={0.1}
                     onChange={(v) => setTweak('entropy', v)} />
        <TweakSection label="Слово / Voice" />
        <TweakText label="Тезис" value={t.thesis}
                   onChange={(v) => setTweak('thesis', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
