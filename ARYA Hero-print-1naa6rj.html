<div class="aryah-boot" id="boot">ARYA · архив открывается</div>

    <ellipse cx="50" cy="44" rx="11" ry="15" fill="#c79356"/>
    <text x="50" y="84" font-family="Georgia, serif" font-size="13" letter-spacing="4" text-anchor="middle" fill="#ece3d2">ARYA</text>
  </svg>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "warmth": 0.5,
  "pace": 1,
  "entropy": 1,
  "density": "regular",
  "thesis": "Каждое семя хранит миллионы лет памяти. Мы следим, чтобы сообщение дошло."
}/*EDITMODE-END*/;

function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    const b = document.getElementById('boot');
    if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 900); }
  }, []);
  return (
    <React.Fragment>
      <AryaHero t={t} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Свет / Light" />
        <TweakSlider label="Тепло света" value={t.warmth} min={0} max={1} step={0.05}
                     onChange={(v) => setTweak('warmth', v)} />
        <TweakSlider label="Длина / pacing" value={t.pace} min={0.5} max={1.8} step={0.1}
                     onChange={(v) => setTweak('pace', v)} />
        <TweakSection label="Архив / Archive" />

      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
