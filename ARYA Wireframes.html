<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ARYA — вайрфреймы</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#FBFAF6;--ink:#33322D;--soft:#8B887C;--ln:#c9c5b8;--acc:#B98428;--hand:"Neucha",cursive;--sans:"PT Sans",sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45;background-image:radial-gradient(rgba(51,50,45,.05) 1px,transparent 1px);background-size:22px 22px;}
a{color:var(--ink);}a:hover{color:var(--acc);}
.board{max-width:1360px;margin:0 auto;padding:26px 22px 90px;}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px;}
.top h1{font-family:var(--hand);font-size:30px;font-weight:400;}
.top p{font-family:var(--hand);color:var(--soft);font-size:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tabs button{font-family:var(--hand);font-size:16px;padding:7px 14px;background:#fff;border:1.5px solid var(--ink);border-radius:18px 4px 18px 4px;cursor:pointer;color:var(--ink);}
.tabs button.on{background:var(--ink);color:#fff;}
.pages{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;}
.frame{width:360px;max-width:100%;background:#fff;border:1.5px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 rgba(51,50,45,.12);}
.frame-head{padding:10px 14px;border-bottom:1.5px dashed var(--ln);display:flex;flex-direction:column;gap:1px;}
.frame-head b{font-family:var(--hand);font-size:18px;font-weight:400;}
.frame-head span{font-family:var(--hand);font-size:13.5px;color:var(--soft);}
.frame-body{padding:14px;display:flex;flex-direction:column;gap:2px;}
.wf-sec{border:1.5px solid var(--ln);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:9px;background:#fff;}
.wf-sec.hl{border-color:var(--acc);background:rgba(185,132,40,.05);}
.wf-sec-tag{font-family:var(--hand);font-size:13.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;}
.wf-sec-tag.dark{color:var(--ink);}
.wf-arrow{text-align:center;font-family:var(--hand);color:var(--soft);font-size:15px;line-height:1.15;}
.wf-h{display:flex;flex-direction:column;gap:7px;}
.wf-h b{height:14px;background:var(--ink);opacity:.85;border-radius:2px;display:block;}
.wf-h.s b{height:9px;}
.wf-txt{display:flex;flex-direction:column;gap:5px;}
.wf-txt i{height:5px;background:var(--ln);border-radius:2px;display:block;}
.wf-img{position:relative;border:1.5px solid var(--ln);border-radius:4px;background:#FAF9F4;overflow:hidden;flex:0 0 auto;min-width:52px;}
.wf-img svg{position:absolute;inset:0;width:100%;height:100%;}
.wf-img line{stroke:var(--ln);stroke-width:1;}
.wf-img span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:12px;color:var(--soft);}
.wf-btn{font-family:var(--hand);font-size:15px;border:1.5px solid var(--ink);border-radius:16px 4px 16px 4px;padding:6px 16px;align-self:flex-start;display:inline-block;}
.wf-btn.solid{background:var(--ink);color:#fff;}
.wf-btn.small{font-size:13px;padding:3px 11px;}
.wf-note{font-family:var(--hand);font-size:14px;color:var(--acc);line-height:1.3;}
.wf-q{font-family:var(--hand);font-size:19px;}
.wf-q.big2{font-size:24px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:var(--hand);font-size:14px;border:1.5px solid var(--ink);border-radius:14px;padding:4px 11px;background:#fff;}
.chip.more{border-style:dashed;color:var(--soft);}
.chips.big{flex-direction:column;}
.chip.grp{display:flex;flex-direction:column;border-radius:6px;padding:8px 12px;gap:1px;}
.chip.grp b{font-size:15.5px;font-weight:400;}
.chip.grp i{font-style:normal;font-size:12.5px;color:var(--soft);}
.wf-result{border:1.5px solid var(--ink);border-radius:6px;padding:11px;display:flex;flex-direction:column;gap:9px;background:#fff;}
.row{display:flex;gap:11px;align-items:flex-start;}
.row .wf-img{width:52px;}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.mini-b{border:1.5px solid var(--ln);border-radius:5px;padding:8px 7px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-family:var(--hand);font-size:12.5px;}
.mini-b.num b{font-size:16px;font-weight:400;}
.mini-b .gk{font-size:13px;}
.mini-b.wide{grid-column:1/-1;flex-direction:row;justify-content:center;}
.row.alt2{gap:7px;}
.mini{font-family:var(--hand);font-size:12.5px;color:var(--soft);border:1.5px dashed var(--ln);border-radius:5px;padding:5px 9px;flex:1;text-align:center;}
.mini.c{text-align:center;border:0;padding:2px;}
.row.fnd{align-items:center;border-top:1.5px dashed var(--acc);padding-top:9px;}
.fdot{width:12px;height:12px;border-radius:50%;background:var(--acc);flex:0 0 auto;}
.fl{font-family:var(--hand);font-size:14.5px;font-weight:400;display:block;}
.fl2{font-family:var(--hand);font-size:12.5px;color:var(--soft);font-style:normal;display:block;}
.pr{font-family:var(--hand);font-size:13.5px;color:var(--ink);letter-spacing:.03em;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.cell{display:flex;flex-direction:column;gap:3px;font-family:var(--hand);font-size:10.5px;text-align:center;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pcard{border:1.5px solid var(--ln);border-radius:5px;padding:8px;display:flex;flex-direction:column;gap:4px;font-family:var(--hand);}
.pcard b{font-size:14px;font-weight:400;}
.pcard i{font-style:normal;font-size:11.5px;color:var(--soft);}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.line-row{display:flex;align-items:center;gap:9px;border-bottom:1.5px dashed var(--ln);padding:7px 2px;font-family:var(--hand);}
.line-row .ln{font-size:15px;}
.line-row .lh{font-style:normal;font-size:12px;color:var(--soft);flex:1;}
.line-row .arr{color:var(--acc);}
.line-row.more2{justify-content:center;color:var(--soft);border-bottom:0;font-size:13px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.split .gk{font-family:var(--hand);font-size:14px;font-weight:400;display:block;margin-bottom:5px;}
.wf-table{border:1.5px solid var(--ln);border-radius:5px;overflow:hidden;font-family:var(--hand);font-size:12.5px;}
.wf-table div{padding:5px 9px;border-bottom:1.5px dashed var(--ln);}
.wf-table div:last-child{border-bottom:0;}
.wf-table .th{background:rgba(51,50,45,.06);}
.peek{font-family:var(--hand);font-size:12px;color:var(--soft);text-align:center;border-bottom:1.5px dashed var(--ln);padding-bottom:3px;}
.hscroll{display:flex;gap:8px;overflow:hidden;}
.hcard{flex:0 0 96px;border:1.5px solid var(--ink);border-radius:6px;padding:7px;display:flex;flex-direction:column;gap:4px;font-family:var(--hand);}
.hcard b{font-size:12.5px;font-weight:400;}
.hcard i{font-style:normal;font-size:11px;color:var(--soft);}
.hcard .pr{font-size:11px;}
.hcard .wf-btn{font-size:11.5px;padding:2px 8px;}
.hcard.ghost{flex:0 0 26px;border-style:dashed;align-items:center;justify-content:center;color:var(--soft);font-size:18px;}
@media(max-width:820px){.pages{justify-content:center;}.frame{width:100%;max-width:420px;}}
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-root"></div>

</template>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="arya-wireframes.jsx"></script>
</body>
</html>
