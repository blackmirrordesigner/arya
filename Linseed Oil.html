<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARYA · Льняное масло · N° 04 Mono</title>
<link rel="stylesheet" href="pdp.css" />
<link rel="stylesheet" href="chronicle.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="image-slot.js"></script>
<script type="text/babel" src="PdpHero.jsx"></script>
<script type="text/babel" src="PdpSections.jsx"></script>
<script type="text/babel" src="PdpChronicle.jsx"></script>

<script type="text/babel">
function App() {
  const [qty, setQty] = React.useState(1);
  const [view, setView] = React.useState('bottle');
  const [cartCount, setCartCount] = React.useState(0);
  const [toast, setToast] = React.useState('');
  const [stickyShown, setStickyShown] = React.useState(false);

  const addToCart = React.useCallback(() => {
    setCartCount(c => c + qty);
    setToast(`Добавлено · ${qty} × 100 ml`);
    window.clearTimeout(window.__aryaToastT);
    window.__aryaToastT = window.setTimeout(() => setToast(''), 2400);
  }, [qty]);

  // sticky add-to-cart appears on mobile after scrolling past hero
  React.useEffect(() => {
    function onScroll() {
      const hero = document.getElementById('hero');
      if (!hero) return;
      const heroBottom = hero.getBoundingClientRect().bottom;
      setStickyShown(heroBottom < 0);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // soft-reveal observer
  React.useEffect(() => {
    const els = document.querySelectorAll('.section');
    els.forEach(el => el.classList.add('reveal'));
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('is-in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <PdpNav cartCount={cartCount} />
      <main>
        <PdpHero qty={qty} setQty={setQty} onAdd={addToCart} view={view} setView={setView} />
        <TrustStrip />
        <Chronicle />
        <PullQuote />
        <Production />
        <HowTo />
        <Taste />
        <Storage />
        <FAQ />
        <Related />
        <ClosingCTA onAdd={addToCart} />
      </main>
      <PdpFooter />

      <div className={`sticky-buy ${stickyShown ? 'is-visible' : ''}`}>
        <div>
          <div className="sticky-buy__name">Льняное масло · 100 ml</div>
          <div className="sticky-buy__price">220 lei · {qty} × шт</div>
        </div>
        <button className="btn btn--primary" onClick={addToCart}>В корзину →</button>
      </div>

      <div className={`toast ${toast ? 'is-visible' : ''}`}>{toast}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
